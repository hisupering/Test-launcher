plugins { id 'java-library' }

allprojects {
    group = 'com.simplelauncher.engine'
    version = '0.1.0'
    repositories { google(); mavenCentral() }
}

// Only the platform-independent engine modules are Java libraries.
// Android and launcher-app are Android modules and must not receive the
// java-library plugin from the root project.
project(':core') {
    apply plugin: 'java-library'
    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

project(':runtime') {
    apply plugin: 'java-library'
    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    dependencies { api project(':core') }
}

project(':game') {
    apply plugin: 'java-library'
    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    dependencies {
        api project(':core')
        implementation 'com.google.code.gson:gson:2.13.2'
    }
}
