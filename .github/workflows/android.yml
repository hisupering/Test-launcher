name: Test Launcher Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-debug:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Test Launcher
        uses: actions/checkout@v4

      - name: Checkout real Minecraft Java engine
        uses: actions/checkout@v4
        with:
          repository: AngelAuraMC/Amethyst-Android
          ref: v3_openjdk
          path: engine
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Get Java 8 runtime for Android
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav
          path: engine/app_pojavlauncher/src/main/assets/components/jre

      - name: Get Java 17 runtime for Android
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre17-21
          name: jre17-pojav
          path: engine/app_pojavlauncher/src/main/assets/components/jre-new

      - name: Get Java 21 runtime for Android
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre17-21
          name: jre21-pojav
          path: engine/app_pojavlauncher/src/main/assets/components/jre-21

      - name: Get Java 25 runtime for Android
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          workflow_conclusion: completed
          repo: FCL-Team/Android-OpenJDK-Build
          branch: Build_JRE_25
          name: jre25-multiarch
          path: engine/app_pojavlauncher/src/main/assets/components/jre-25

      - name: Install exact Android build dependencies
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"

      - name: Set up Gradle from engine wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Apply Test Launcher product overlay
        run: |
          chmod +x launcher/patch-test-launcher.sh
          ./launcher/patch-test-launcher.sh engine

      - name: Build real Android APK
        working-directory: engine
        run: |
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon --stacktrace

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: Test-Launcher-debug
          path: engine/app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
