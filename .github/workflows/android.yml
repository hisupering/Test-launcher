name: Simple Launcher Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-simple-engine:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Simple Launcher
        uses: actions/checkout@v4

      - name: Set up JDK 8 for Android LWJGL build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build dependencies
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          # Use the NDK already installed on the GitHub Ubuntu image.
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - name: Build Android LWJGL bridge (arm64)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ant
          git clone --depth 1 --branch wip/rebase_3.3.3 https://github.com/AngelAuraMC/lwjgl3.git .ci-lwjgl
          export JAVA8_HOME="${JAVA_HOME_8_X64:-$JAVA_HOME}"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.3.13750724"
          export LWJGL_BUILD_ARCH=arm64
          cd .ci-lwjgl
          bash ci_build_android.bash
          cd ..
          rm -rf simple-engine/launcher-app/src/main/assets/simple-lwjgl
          mkdir -p simple-engine/launcher-app/src/main/assets/simple-lwjgl/arm64/jars
          mkdir -p simple-engine/launcher-app/src/main/assets/simple-lwjgl/arm64/natives
          find .ci-lwjgl/bin/RELEASE -type f -name '*.jar' -exec cp {} simple-engine/launcher-app/src/main/assets/simple-lwjgl/arm64/jars/ \;
          # Package every shared library emitted or downloaded by the Android LWJGL build,
          # including GLFW and OpenAL dependencies that bin/out omits.
          find .ci-lwjgl/bin/libs/native/linux/arm64/org/lwjgl .ci-lwjgl/bin/out -type f -name '*.so' -exec cp {} simple-engine/launcher-app/src/main/assets/simple-lwjgl/arm64/natives/ \;

      - name: Build independent Simple Engine
        working-directory: simple-engine
        run: |
          gradle --no-daemon clean build

      - name: Publish Simple Engine libraries
        uses: actions/upload-artifact@v4
        with:
          name: Simple-Engine-APK-${{ github.run_number }}
          path: |
            simple-engine/core/build/libs/*.jar
            simple-engine/runtime/build/libs/*.jar
            simple-engine/game/build/libs/*.jar
            simple-engine/android/build/outputs/aar/*.aar
            simple-engine/launcher-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
