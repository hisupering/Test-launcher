name: Simple Launcher Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-simple-engine:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Simple Launcher
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build dependencies
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Build independent Simple Engine
        working-directory: simple-engine
        run: |
          gradle --no-daemon clean build

      - name: Publish Simple Engine libraries
        uses: actions/upload-artifact@v4
        with:
          name: Simple-Engine-APK-${{ github.run_number }}
          path: |
            simple-engine/core/build/libs/*.jar
            simple-engine/runtime/build/libs/*.jar
            simple-engine/game/build/libs/*.jar
            simple-engine/android/build/outputs/aar/*.aar
            simple-engine/launcher-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
