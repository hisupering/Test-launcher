name: Test Launcher Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-debug:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Test Launcher
        uses: actions/checkout@v4

      - name: Checkout real Minecraft Java engine
        uses: actions/checkout@v4
        with:
          repository: AngelAuraMC/Amethyst-Android
          ref: v3_openjdk
          path: engine
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Get Java 8 runtime for Android
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav
          path: engine/app_pojavlauncher/src/main/assets/components/jre

      # Java 17/21/25 are intentionally not downloaded yet.
      # The upstream Amethyst build currently enables only JRE8 by default.
      # We will add verified runtime artifacts one-by-one after the base APK build is green.

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: '9.6.1'

      - name: Apply Test Launcher product overlay
        run: |
          chmod +x launcher/patch-test-launcher.sh
          ./launcher/patch-test-launcher.sh engine

      - name: Build real Android APK
        working-directory: engine
        run: |
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: Test-Launcher-debug
          path: engine/app_pojavlauncher/build/outputs/apk/debug/*.apk
          if-no-files-found: error
